uz:{menu:'Menyu',about:'Biz haqimizda',gallery:'Galereya',contact:'Aloqa',slogan:'Pitsa, fastfud va ichimliklar',view:'Menyuni ko‘rish',all:'Hammasi',search:'Taom nomi bo‘yicha qidirish...',sd:'Odatiy',sa:'Narx ↑',sdn:'Narx ↓',add:'Savatga',cart:'Savat',total:'JAMI:',order:'Buyurtma berish',empty:'Hech narsa topilmadi',ce:'Savat bo‘sh',added:'Savatga qo‘shildi',cur:'so‘m',ap:'Onlayn menyu: taomni, o‘lcham yoki hajmni tanlab, savatga qo‘shing.',cp:'Aloqa ma’lumotlari hozircha ko‘rsatilmagan.',om:'Buyurtma qabul qilish hozircha ulanmagan. Keyinroq ulash mumkin.',ft:'Barcha narxlar so‘mda ko‘rsatilgan.'}};
const IC={'Пицца':'<svg viewBox="0 0 64 64"><path d="M6 14c16-8 36-8 52 0L32 58z"/><path d="M10 22c14-6 30-6 44 0"/><circle cx="26" cy="26" r="3"/><circle cx="38" cy="30" r="3"/><circle cx="32" cy="42" r="3"/></svg>','Фастфуд':'<svg viewBox="0 0 64 64"><path d="M40 8c10 2 16 12 12 22-3 7-10 10-17 9l-8-7C21 25 24 11 40 8z"/><path d="M27 32 12 47"/><circle cx="9" cy="50" r="4"/><circle cx="16" cy="55" r="4"/></svg>','Напитки':'<svg viewBox="0 0 64 64"><path d="M16 18h32l-4 40H20z"/><path d="M14 18h36M36 18l6-12 8-2"/><path d="M19 32h26"/></svg>'};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang=localStorage.getItem('lang')||'ru',cat='all',sel={},cart={};try{lang=localStorage.getItem('lang')||'ru'}catch(e){}
const t=k=>T[lang][k],fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' '+t('cur');
const dn=d=>d[lang],ing=d=>lang=='ru'?d.iru:d.iuz,wt=v=>lang=='ru'?v.w:v.wu,sv=d=>d.vars[sel[d.id]||0],catn=k=>D.cats.find(c=>c.k==k)[lang];
const PH='<span>🍕</span>';
function img(v,alt){return v.img?`<img loading="lazy" src="${v.img}" alt="${esc(alt)}" onerror="this.parentNode.innerHTML=PH;this.remove&&0">`:PH}
function texts(){document.documentElement.lang=lang;$('lg').textContent=D.name;$('h1').innerHTML=D.name.replace(/(\S+)$/,'<span>$1</span>');
$('nav').innerHTML=['menu','about','gallery','contact'].map(k=>`<a href="#${k}">${t(k)}</a>`).join('');
$('sl').textContent=t('slogan');$('vm').textContent=t('view');$('mt').textContent=t('menu');$('at').textContent=t('about');$('gt').textContent=t('gallery');$('ct').textContent=t('contact');
$('ap').textContent=t('ap');$('cp').textContent=t('cp');$('ft').textContent='© '+D.name+' · '+t('ft');$('q').placeholder=t('search');
$('so').innerHTML=[['d','sd'],['a','sa'],['n','sdn']].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join('');$('so').value=so;
$('cth').textContent=t('cart');$('tl').textContent=t('total');$('ord').textContent=t('order');
document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==lang));
$('cats').innerHTML=`<button class="cat ${cat=='all'?'on':''}" data-c="all"><svg viewBox="0 0 64 64"><rect x="8" y="8" width="20" height="20" rx="5"/><rect x="36" y="8" width="20" height="20" rx="5"/><rect x="8" y="36" width="20" height="20" rx="5"/><rect x="36" y="36" width="20" height="20" rx="5"/></svg>${t('all')}</button>`+D.cats.map(c=>`<button class="cat ${cat==c.k?'on':''}" data-c="${c.k}">${IC[c.ru]||''}${esc(c[lang])}</button>`).join('')}
let so='d';
function grid(){const q=$('q').value.trim().toLowerCase();let L=D.dishes.filter(d=>(cat=='all'||d.cat==cat)&&(!q||[d.ru,d.uz,d.iru,d.iuz,catn(d.cat)].join(' ').toLowerCase().includes(q)));
const mp=d=>Math.min(...d.vars.map(v=>v.p));if(so=='a')L.sort((a,b)=>mp(a)-mp(b));if(so=='n')L.sort((a,b)=>mp(b)-mp(a));
$('grid').innerHTML=L.length?L.map(d=>{const v=sv(d);return`<article class="card" data-id="${d.id}"><div class="ph" data-z="1">${img(v,dn(d))}</div><div class="bd"><span class="tag">${esc(catn(d.cat))}</span><h3>${esc(dn(d))}</h3><div class="vs">${d.vars.map((x,i)=>`<button class="${i==(sel[d.id]||0)?'on':''}" data-i="${i}">${esc(wt(x))}</button>`).join('')}</div><p class="ing">${esc(ing(d))}</p><div class="pr"><b>${fmt(v.p)}</b><button class="btn" data-add="1">+ ${t('add')}</button></div></div></article>`}).join(''):`<div class="empty">${t('empty')}</div>`}
function gal(){const u=[];D.dishes.forEach(d=>d.vars.forEach(v=>{if(v.img&&!u.includes(v.img))u.push(v.img)}));$('gal').innerHTML=u.map(s=>`<img loading="lazy" src="${s}" alt="">`).join('')}
function rc(){let n=0,s=0,h='';for(const k in cart){const[id,i]=k.split('|'),d=D.dishes.find(x=>x.id==id),v=d.vars[i],q=cart[k];n+=q;s+=q*v.p;h+=`<div class="it"><div><b>${esc(dn(d))}</b><br><small>${esc(wt(v))}</small></div><div class="q"><button data-m="${k}">−</button>${q}<button data-p="${k}">+</button><button class="x" data-x="${k}">✕</button></div><small>${q} × ${fmt(v.p).replace(' '+t('cur'),'')}</small><b style="text-align:right">${fmt(q*v.p)}</b></div>`}
$('items').innerHTML=h||`<p class="empty">${t('ce')}</p>`;$('tv').textContent=fmt(s);$('fab').textContent='🛒 '+t('cart')+' '+n;$('ord').disabled=!n}
function toast(m){$('msg').textContent=m}
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let b;
if(b=g('.lang button')){lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(x){}texts();grid();rc();return}
if(b=g('.cat')){cat=b.dataset.c;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x==b));grid();return}
const card=g('.card');
if(card&&(b=g('.vs button'))){sel[card.dataset.id]=+b.dataset.i;grid();return}
if(card&&g('[data-add]')){const d=D.dishes.find(x=>x.id==card.dataset.id),k=d.id+'|'+(sel[d.id]||0);cart[k]=(cart[k]||0)+1;rc();toast(t('added'));return}
if(card&&g('.ph img')){$('vw').querySelector('img').src=sv(D.dishes.find(x=>x.id==card.dataset.id)).img;$('vw').classList.add('on');return}
if(g('#gal img')){$('vw').querySelector('img').src=e.target.src;$('vw').classList.add('on');return}
if(g('#vw')){$('vw').classList.remove('on');return}
if(g('#fab')){document.body.classList.add('co');return}
if(g('#cx')||e.target.id=='ov'){document.body.classList.remove('co');return}
if(b=g('[data-p]')){cart[b.dataset.p]++;rc()}else if(b=g('[data-m]')){if(--cart[b.dataset.m]<=0)delete cart[b.dataset.m];rc()}else if(b=g('[data-x]')){delete cart[b.dataset.x];rc()}
else if(g('#ord'))toast(t('om'))});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('vw').classList.remove('on')});
$('q').oninput=grid;$('so').onchange=e=>{so=e.target.value;grid()};
const first=D.dishes[0].vars[0].img;if(first)$('hero').style.backgroundImage=`url(${first})`;
texts();grid();gal();rc();
</script></body></html>
